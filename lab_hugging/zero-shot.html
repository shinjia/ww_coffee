<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>零樣本分類｜文字 AI 實驗室</title><link rel="stylesheet" href="css/style.css?v=2026083003"></head><body><header class="lab-nav"><a class="brand" href="index.html"><span class="brand-mark">WW</span><strong>文字 AI 實驗室</strong></a><a href="index.html">← 所有實驗</a></header><main><section class="simple-hero"><div><p class="eyebrow">LAB 02</p><h1>零樣本分類</h1><p>提供候選標籤，讓模型在未針對這些類別重新訓練的情況下排列可能性。此英文 MNLI 模型建議使用英文標籤。</p></div></section><section class="simple-lab"><div class="task-meta"><span>Pipeline：<code>zero-shot-classification</code></span><span>Model：<code>Xenova/mobilebert-uncased-mnli</code></span></div><div class="simple-grid"><label class="field">顧客留言<textarea id="text" maxlength="800">The air conditioner is too cold.</textarea></label><label class="field">候選標籤（逗號分隔）<textarea id="labels" maxlength="300">coffee quality, food, service, price, environment, event, other</textarea></label></div><button class="button button-secondary" id="load-button">載入模型</button><div class="runtime-status"><div class="status-line"><span id="status-text">尚未載入模型</span><strong id="progress-text">0%</strong></div><progress id="progress" max="100" value="0"></progress><small id="status-detail">首次使用需下載模型。</small></div><button class="button button-primary" id="run-button" disabled>執行分類</button><p id="action-status" class="action-status" role="status"></p><h2>分類排名</h2><div id="human-output" class="output-box output-list">結果會顯示在這裡。</div><details><summary>Raw JSON</summary><pre id="raw-output"></pre></details><h2>測試案例</h2><div class="sample-list"><button class="sample-button" data-sample='{"text":"The staff was friendly but our drinks took thirty minutes.","labels":"coffee quality, food, service, price, environment, event, other"}'>服務很親切但等待過久（英文）</button><button class="sample-button" data-sample='{"text":"The air conditioner is too cold.","labels":"coffee quality, food, service, price, environment, event, other"}'>冷氣太冷</button><button class="sample-button" data-sample='{"text":"Coffee 很好喝 but the price is high.","labels":"coffee quality, food, service, price, environment, other"}'>中英混合</button></div></section></main><footer><p>Pipeline 與 Model 是不同概念</p><p>模型有輸出不等於答案可靠</p></footer><script type="module" src="js/zero-shot.js?v=2026083001"></script></body></html>
