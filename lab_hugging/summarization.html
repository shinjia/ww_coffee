<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字摘要｜文字 AI 實驗室</title><link rel="stylesheet" href="css/style.css?v=2026083003"></head><body><header class="lab-nav"><a class="brand" href="index.html"><span class="brand-mark">WW</span><strong>文字 AI 實驗室</strong></a><a href="index.html">← 所有實驗</a></header><main><section class="simple-hero"><div><p class="eyebrow">LAB 05</p><h1>文字摘要</h1><p>將較長的英文顧客意見或店務紀錄濃縮。模型較大，首次下載與推論可能明顯較久。</p></div></section><section class="simple-lab"><div class="task-meta"><span>Pipeline：<code>summarization</code></span><span>Model：<code>Xenova/distilbart-cnn-6-6</code></span></div><label class="field">英文長文<textarea id="text" maxlength="5000">Customers praised the coffee aroma and the helpful baristas throughout the weekend. Several visitors, however, reported that orders took more than twenty minutes during the afternoon rush. Many suggested adding clearer signs for the pickup counter. The team agreed to review staffing levels and update the signs before next weekend.</textarea></label><button class="button button-secondary" id="load-button">載入模型</button><div class="runtime-status"><div class="status-line"><span id="status-text">尚未載入模型</span><strong id="progress-text">0%</strong></div><progress id="progress" max="100"></progress><small id="status-detail">建議桌機使用，避免同時載入多個大型模型。</small></div><button class="button button-primary" id="run-button" disabled>產生摘要</button><p id="action-status" class="action-status" role="status"></p><h2>摘要</h2><div id="human-output" class="output-box">結果會顯示在這裡。</div><details><summary>Raw JSON</summary><pre id="raw-output"></pre></details></section></main><footer><p>摘要可能遺漏細節或產生錯誤敘述</p><p>請與原文比較</p></footer><script type="module" src="js/summarization.js?v=2026083001"></script></body></html>
