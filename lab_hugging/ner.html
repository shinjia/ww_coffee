<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>命名實體辨識｜文字 AI 實驗室</title><link rel="stylesheet" href="css/style.css?v=2026083003"></head><body><header class="lab-nav"><a class="brand" href="index.html"><span class="brand-mark">WW</span><strong>文字 AI 實驗室</strong></a><a href="index.html">← 所有實驗</a></header><main><section class="simple-hero"><div><p class="eyebrow">LAB 03</p><h1>命名實體辨識 NER</h1><p>辨識英文文字中的人物、組織、地點等實體。模型可能把一個詞拆成多個 Token，原始輸出會完整保留。</p></div></section><section class="simple-lab"><div class="task-meta"><span>Pipeline：<code>token-classification</code></span><span>Model：<code>Xenova/bert-base-NER</code></span></div><label class="field">文字<textarea id="text" maxlength="800">Ms. Chen will visit the Wood Window Coffee shop in Taoyuan on September 12.</textarea></label><button class="button button-secondary" id="load-button">載入模型</button><div class="runtime-status"><div class="status-line"><span id="status-text">尚未載入模型</span><strong id="progress-text">0%</strong></div><progress id="progress" max="100"></progress><small id="status-detail">此模型以英文 NER 為主。</small></div><button class="button button-primary" id="run-button" disabled>辨識實體</button><p id="action-status" class="action-status" role="status"></p><h2>辨識結果</h2><div id="human-output" class="output-box output-list">結果會顯示在這裡。</div><details><summary>Raw JSON</summary><pre id="raw-output"></pre></details><h2>測試案例</h2><div class="sample-list"><button class="sample-button" data-sample='{"text":"Alice works at OpenAI in San Francisco."}'>人物、組織、地點</button><button class="sample-button" data-sample='{"text":"John met Mary near Taipei 101."}'>兩個人物與地點</button><button class="sample-button" data-sample='{"text":"陳小姐預計到桃園店參加活動。"}'>中文邊界案例</button></div></section></main><footer><p>NER 模型的標籤與語言能力取決於訓練資料</p><p>注意子詞 Token</p></footer><script type="module" src="js/ner.js?v=2026083001"></script></body></html>
