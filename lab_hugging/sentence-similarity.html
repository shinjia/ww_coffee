<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="以 Transformers.js 在瀏覽器比較兩句文字的語意相似度。"><title>句子相似度｜文字 AI 實驗室</title><link rel="stylesheet" href="css/style.css?v=2026083003"></head><body><header class="lab-nav"><a class="brand" href="index.html"><span class="brand-mark">WW</span><strong>文字 AI 實驗室</strong></a><a href="index.html">← 所有實驗</a></header><main><section class="simple-hero"><div><p class="eyebrow">LAB 11</p><h1>Sentence Similarity</h1><p>先把兩句英文轉成正規化 Embedding，再用 cosine similarity 比較語意方向。分數越接近 1，代表模型判斷越相似。</p></div></section><section class="simple-lab"><div class="task-meta"><span>Pipeline：<code>feature-extraction</code></span><span>Model：<code>Xenova/all-MiniLM-L6-v2</code></span></div><label class="field">句子 A<textarea id="sentence-a" maxlength="800">The coffee tastes wonderful.</textarea></label><label class="field">句子 B<textarea id="sentence-b" maxlength="800">This cup of coffee is delicious.</textarea></label><button class="button button-secondary" id="load-button" type="button">載入模型</button><div class="runtime-status"><div class="status-line"><span id="status-text">尚未載入模型</span><strong id="progress-text">0%</strong></div><progress id="progress" max="100"></progress><small id="status-detail">英文句向量模型；其他語言的結果不應視為可靠。</small></div><button class="button button-primary" id="run-button" type="button" disabled>比較相似度</button><p id="action-status" class="action-status" role="status" aria-live="polite"></p><h2>比較結果</h2><div id="human-output" class="output-box">結果會顯示在這裡。</div><details><summary>Raw JSON</summary><pre id="raw-output"></pre></details><h2>測試案例</h2><div class="sample-list"><button class="sample-button" type="button" data-sample='["The café serves excellent espresso.","This coffee shop makes great espresso."]'>相近語意</button><button class="sample-button" type="button" data-sample='["The café closes at six.","A bicycle is parked outside."]'>不同語意</button><button class="sample-button" type="button" data-sample='["I enjoyed the quiet atmosphere.","The room was peaceful and pleasant."]'>不同用字</button></div></section></main><footer><p>相似度是模型估計，不是客觀真理</p><p>Transformers.js 3.8.1 · 無 API Key</p></footer><script type="module" src="js/sentence-similarity.js?v=2026083001"></script></body></html>
