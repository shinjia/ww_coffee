<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text2Text｜文字 AI 實驗室</title><link rel="stylesheet" href="css/style.css?v=2026083003"></head><body><header class="lab-nav"><a class="brand" href="index.html"><span class="brand-mark">WW</span><strong>文字 AI 實驗室</strong></a><a href="index.html">← 所有實驗</a></header><main><section class="simple-hero"><div><p class="eyebrow">LAB 10</p><h1>Text2Text 文字轉文字</h1><p>將任務寫成指令交給 FLAN-T5，例如改寫、簡化或摘要。此模型主要支援英文。</p></div></section><section class="simple-lab"><div class="task-meta"><span>Pipeline：<code>text2text-generation</code></span><span>Model：<code>Xenova/flan-t5-small</code></span></div><label class="field">英文指令<input id="instruction" maxlength="300" value="Rewrite in a friendly tone"></label><label class="field">文字<textarea id="text" maxlength="2000">Customers must wait at the counter until their order number is called.</textarea></label><button class="button button-secondary" id="load-button">載入模型</button><div class="runtime-status"><div class="status-line"><span id="status-text">尚未載入模型</span><strong id="progress-text">0%</strong></div><progress id="progress" max="100"></progress><small id="status-detail">使用 q4 降低瀏覽器負擔。</small></div><button class="button button-primary" id="run-button" disabled>執行轉換</button><p id="action-status" class="action-status" role="status"></p><h2>轉換結果</h2><div id="human-output" class="output-box">結果會顯示在這裡。</div><details><summary>Raw JSON</summary><pre id="raw-output"></pre></details><h2>測試案例</h2><div class="sample-list"><button class="sample-button" data-sample='{"instruction":"Rewrite in a friendly tone","text":"Customers must wait at the counter until their order number is called."}'>改為友善語氣</button><button class="sample-button" data-sample='{"instruction":"Make this shorter","text":"Our coffee is carefully selected, roasted, tested, and brewed to provide a balanced everyday cup."}'>縮短文字</button><button class="sample-button" data-sample='{"instruction":"Paraphrase","text":"The cafe is quiet in the morning but becomes busy after lunch."}'>改寫句子</button></div></section></main><footer><p>指令與輸入會共同影響結果</p><p>FLAN-T5-small 能力有限</p></footer><script type="module" src="js/text2text.js?v=2026083001"></script></body></html>
