<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問答｜文字 AI 實驗室</title><link rel="stylesheet" href="css/style.css?v=2026083003"></head><body><header class="lab-nav"><a class="brand" href="index.html"><span class="brand-mark">WW</span><strong>文字 AI 實驗室</strong></a><a href="index.html">← 所有實驗</a></header><main><section class="simple-hero"><div><p class="eyebrow">LAB 04</p><h1>擷取式問答</h1><p>答案必須存在於 Context 中。模型不是查網路，而是在提供的內容內找最可能的片段。</p></div></section><section class="simple-lab"><div class="task-meta"><span>Pipeline：<code>question-answering</code></span><span>Model：<code>Xenova/distilbert-base-cased-distilled-squad</code></span></div><label class="field">Context<textarea id="context" maxlength="3000">Wood Window Coffee opens at 9 AM and closes at 6 PM. Members receive a free dessert during their birthday month.</textarea></label><label class="field">Question<input id="question" maxlength="300" value="What do members receive during their birthday month?"></label><button class="button button-secondary" id="load-button">載入模型</button><div class="runtime-status"><div class="status-line"><span id="status-text">尚未載入模型</span><strong id="progress-text">0%</strong></div><progress id="progress" max="100"></progress><small id="status-detail">英文 SQuAD 模型，中文答案不可靠。</small></div><button class="button button-primary" id="run-button" disabled>尋找答案</button><p id="action-status" class="action-status" role="status"></p><h2>答案</h2><div id="human-output" class="output-box">結果會顯示在這裡。</div><details><summary>Raw JSON</summary><pre id="raw-output"></pre></details><h2>測試案例</h2><div class="sample-list"><button class="sample-button" data-sample='{"context":"Wood Window Coffee opens at 9 AM and closes at 6 PM.","question":"When does the shop open?"}'>營業時間</button><button class="sample-button" data-sample='{"context":"The tasting event takes place in Taoyuan on September 12.","question":"Where is the event?"}'>活動地點</button><button class="sample-button" data-sample='{"context":"The house blend tastes like caramel and cocoa.","question":"What does the blend taste like?"}'>風味描述</button></div></section></main><footer><p>答案只來自 Context</p><p>沒有答案時模型仍可能猜測</p></footer><script type="module" src="js/qa.js?v=2026083001"></script></body></html>
