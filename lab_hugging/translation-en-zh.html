<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英翻中｜文字 AI 實驗室</title><link rel="stylesheet" href="css/style.css?v=2026083003"></head><body><header class="lab-nav"><a class="brand" href="index.html"><span class="brand-mark">WW</span><strong>文字 AI 實驗室</strong></a><a href="index.html">← 所有實驗</a></header><main><section class="simple-hero"><div><p class="eyebrow">LAB 07</p><h1>Translation · EN → ZH</h1><p>將英文咖啡資訊翻譯為中文，觀察專有名詞、風味與語氣如何被轉換。</p></div></section><section class="simple-lab"><div class="task-meta"><span>Pipeline：<code>translation</code></span><span>Model：<code>Xenova/opus-mt-en-zh</code></span></div><label class="field">英文<textarea id="text" maxlength="2000">This light-roast coffee has floral aromas, bright citrus acidity, and a gentle honey finish.</textarea></label><button class="button button-secondary" id="load-button">載入模型</button><div class="runtime-status"><div class="status-line"><span id="status-text">尚未載入模型</span><strong id="progress-text">0%</strong></div><progress id="progress" max="100"></progress><small id="status-detail">首次使用需下載翻譯模型。</small></div><button class="button button-primary" id="run-button" disabled>翻譯為中文</button><p id="action-status" class="action-status" role="status"></p><h2>中文翻譯</h2><div id="human-output" class="output-box">結果會顯示在這裡。</div><details><summary>Raw JSON</summary><pre id="raw-output"></pre></details></section></main><footer><p>翻譯結果需人工校對</p><p>注意咖啡專有名詞</p></footer><script type="module" src="js/translation-en-zh.js?v=2026083001"></script></body></html>
