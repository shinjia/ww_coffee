<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字生成｜文字 AI 實驗室</title><link rel="stylesheet" href="css/style.css?v=2026083003"></head><body><header class="lab-nav"><a class="brand" href="index.html"><span class="brand-mark">WW</span><strong>文字 AI 實驗室</strong></a><a href="index.html">← 所有實驗</a></header><main><section class="simple-hero"><div><p class="eyebrow">LAB 06</p><h1>文字生成</h1><p>英文 DistilGPT-2 會接續提示文字。它不是聊天模型，內容可能重複、不正確或偏離木窗咖啡情境。</p></div></section><section class="simple-lab"><div class="task-meta"><span>Pipeline：<code>text-generation</code></span><span>Model：<code>Xenova/distilgpt2</code></span></div><div class="simple-grid"><label class="field">英文提示<textarea id="text" maxlength="1000">At Wood Window Coffee, every cup begins with</textarea></label><label class="field">新增 Token 數<input id="tokens" type="number" min="5" max="80" value="40"><small class="input-help">5–80，越多需要越久。</small></label></div><button class="button button-secondary" id="load-button">載入模型</button><div class="runtime-status"><div class="status-line"><span id="status-text">尚未載入模型</span><strong id="progress-text">0%</strong></div><progress id="progress" max="100"></progress><small id="status-detail">每次生成可能不同。</small></div><button class="button button-primary" id="run-button" disabled>生成文字</button><p id="action-status" class="action-status" role="status"></p><h2>生成結果</h2><div id="human-output" class="output-box">結果會顯示在這裡。</div><details><summary>Raw JSON</summary><pre id="raw-output"></pre></details></section></main><footer><p>生成流暢不代表內容正確</p><p>請勿直接當作正式文案</p></footer><script type="module" src="js/generation.js?v=2026083001"></script></body></html>
