<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遮罩填詞｜文字 AI 實驗室</title><link rel="stylesheet" href="css/style.css?v=2026083003"></head><body><header class="lab-nav"><a class="brand" href="index.html"><span class="brand-mark">WW</span><strong>文字 AI 實驗室</strong></a><a href="index.html">← 所有實驗</a></header><main><section class="simple-hero"><div><p class="eyebrow">LAB 09</p><h1>Fill-Mask 遮罩填詞</h1><p>在句中放入一個 <code>[MASK]</code>，觀察多語 BERT 如何依上下文預測缺少的 Token。</p></div></section><section class="simple-lab"><div class="task-meta"><span>Pipeline：<code>fill-mask</code></span><span>Model：<code>Xenova/bert-base-multilingual-cased</code></span></div><label class="field">包含 [MASK] 的句子<textarea id="text" maxlength="800">The coffee tastes [MASK] today.</textarea></label><button class="button button-secondary" id="load-button">載入模型</button><div class="runtime-status"><div class="status-line"><span id="status-text">尚未載入模型</span><strong id="progress-text">0%</strong></div><progress id="progress" max="100"></progress><small id="status-detail">只能使用模型指定的 [MASK] Token。</small></div><button class="button button-primary" id="run-button" disabled>預測缺詞</button><p id="action-status" class="action-status" role="status"></p><h2>前五名預測</h2><div id="human-output" class="output-box output-list">結果會顯示在這裡。</div><details><summary>Raw JSON</summary><pre id="raw-output"></pre></details><h2>測試案例</h2><div class="sample-list"><button class="sample-button" data-sample='{"text":"The coffee tastes [MASK] today."}'>英文形容詞</button><button class="sample-button" data-sample='{"text":"I drink [MASK] every morning."}'>早餐飲品</button><button class="sample-button" data-sample='{"text":"今天的咖啡很[MASK]。"}'>中文邊界案例</button></div></section></main><footer><p>預測的是 Token，不一定是完整單字</p><p>比較不同語言結果</p></footer><script type="module" src="js/fill-mask.js?v=2026083001"></script></body></html>
